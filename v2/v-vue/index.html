<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-preset="naive">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gotod UI (Vue 3.5.9 v2 Edition) - 开发中</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css?v=20260831_55">
  <link rel="stylesheet" href="../../assets/css/style.css?v=20260831_55">
  <!-- Vue 3.5.9 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.9/vue.global.prod.js"></script>
  <style>
    .v2-dev-container {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .v2-dev-card {
      background: var(--bg-card);
      border: 1px solid var(--border-base);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
    }
    .v2-dev-icon {
      font-size: 56px;
      color: #42b883;
      margin-bottom: 20px;
      animation: v2Pulse 2s infinite ease-in-out;
    }
    @keyframes v2Pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="vueApp">
    <!-- Header -->
    <header style="height:56px; padding:0 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-base); background:var(--bg-header);">
      <div style="display:flex; align-items:center; gap:16px;">
        <!-- Clicking top-left brand returns to V1 Classic Edition -->
        <a href="../../" class="brand" title="点击返回 Gotod UI V1 经典版" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--text-main); font-weight:700; font-size:16px;">
          <i class="fa-solid fa-shapes" style="color: var(--primary);"></i>
          <span>gotod-components-ui</span>
          <span class="brand-badge" style="background:#065f46; color:#a7f3d0; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:700;">Vue 3.5.9 v2</span>
          <span style="font-size:12px; color:var(--text-secondary); margin-left:8px; display:flex; align-items:center; gap:4px;">
            <i class="fa-solid fa-arrow-left"></i> 返回 V1 经典版
          </span>
        </a>
      </div>

      <div class="header-actions" style="display:flex; align-items:center; gap:12px;">
        <a href="../../" class="g-btn g-btn-primary" style="font-size:12px; padding:6px 14px; text-decoration:none; display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius); font-weight:700;">
          <i class="fa-solid fa-house"></i>
          <span>返回 V1 经典版</span>
        </a>
        <a href="https://github.com/mhxy13867806343/gotod-components-ui" target="_blank" class="header-btn" title="GitHub 仓库" style="color:var(--text-secondary); font-size:16px; text-decoration:none;">
          <i class="fa-brands fa-github"></i>
        </a>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="v2-dev-container">
      <div class="v2-dev-card">
        <div class="v2-dev-icon">
          <i class="fa-brands fa-vuejs"></i>
        </div>
        <h1 style="font-size:28px; font-weight:800; color:var(--text-main); margin-bottom:12px;">
          Gotod UI v2 (Vue 3.5.9) 正在火热开发中...
        </h1>
        <p style="font-size:15px; color:var(--text-secondary); line-height:1.7; margin-bottom:28px;">
          全新架构升级：基于 Vue 3.5.9 响应式驱动与 Godot 4 高性能游戏 UI 解耦方案重构中。<br>
          您可以随时点击下方或左上角按钮，返回功能完备的 V1 经典版。
        </p>

        <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap;">
          <a href="../../" class="g-btn g-btn-primary" style="font-size:14px; padding:10px 24px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; border-radius:var(--radius); font-weight:700; box-shadow:0 4px 16px rgba(34,197,94,0.35);">
            <i class="fa-solid fa-house"></i>
            <span>立即返回 V1 经典版文档</span>
          </a>
          <a href="../v-jquery/" class="g-btn g-btn-default" style="font-size:14px; padding:10px 20px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; border-radius:var(--radius); font-weight:600;">
            <i class="fa-brands fa-js" style="color:#f7df1e;"></i>
            <span>查看 jQuery 版专区</span>
          </a>
        </div>
      </div>
    </main>

    <!-- JD.com Style Right-Side Fixed Toolbar Dock -->
    <div class="jd-sidebar-dock" aria-label="快捷侧边栏">
      <a href="../../" class="jd-dock-item" title="返回 V1 经典版">
        <i class="fa-solid fa-house" style="color:var(--primary);"></i>
        <span>V1版</span>
      </a>
      <a href="../v-jquery/" class="jd-dock-item" title="切换到 jQuery 架构版本">
        <i class="fa-brands fa-js" style="color:#f7df1e;"></i>
        <span>JQ版</span>
      </a>
      <a href="https://github.com/mhxy13867806343/gotod-components-ui" target="_blank" class="jd-dock-item" title="访问 GitHub 开源仓库">
        <i class="fa-brands fa-github"></i>
        <span>源码</span>
      </a>
      <button class="jd-dock-item" onclick="window.scrollTo({top: 0, behavior: 'smooth'});" title="回到顶部">
        <i class="fa-solid fa-arrow-up"></i>
        <span>顶部</span>
      </button>
    </div>
  </div>

  <script>
    if (window.Vue) {
      const { createApp } = Vue;
      createApp({
        setup() {
          console.log('Gotod UI (Vue 3.5.9 v2 Dev Page) loaded.');
          return {};
        }
      }).mount('#vueApp');
    }
  </script>
</body>
</html>
