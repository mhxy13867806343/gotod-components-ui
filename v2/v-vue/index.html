  <!-- Vue 3.5.9 Reactive Composition Bridge -->
  <script>
    if (window.Vue) {
      const { createApp, ref, onMounted } = Vue;
      const app = createApp({
        setup() {
          const filterKeyword = ref('');
          onMounted(() => {
            console.log('Gotod UI (Vue 3.5.9 v2 Edition) mounted successfully in v2/v-vue.');
            const input = document.getElementById('vueSidebarFilter');
            if (input) {
              input.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                document.querySelectorAll('.nav-item').forEach(item => {
                  const txt = item.textContent.toLowerCase();
                  item.style.display = txt.includes(val) ? '' : 'none';
                });
              });
            }
          });
          return { filterKeyword };
        }
      });
      app.mount('#vueApp');
    }
  </script>
