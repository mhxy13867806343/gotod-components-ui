name: ✨ Feature Request
description: 建议新功能或改进 | Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请尽量详细描述你的想法，以便我们更好地评估和实现。
        Thanks for your feature suggestion!

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 | Preflight Checklist
      options:
        - label: 我已搜索过现有 Issues 和 Discussions，确认该功能尚未被提出 | I've searched existing issues/discussions and this hasn't been suggested
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 功能类别 | Feature Category
      options:
        - 新 UI 组件 | New UI Component
        - 现有组件改进 | Existing Component Improvement
        - 主题 / 样式 | Theme / Styling
        - 工具链 / 开发体验 | Toolchain / DX
        - 文档 / 示例 | Documentation / Examples
        - 性能优化 | Performance
        - 其他 | Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题背景 | Problem Background
      description: 你的功能请求是否与某个问题相关？请描述一下 | Is your feature request related to a problem?
      placeholder: "我在做 [...] 时感到很困扰，因为..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 | Proposed Solution
      description: 描述你想要的功能是什么 | Describe the solution you'd like.
      placeholder: "我希望能够..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 | Alternatives Considered
      description: 你是否考虑过其他替代方案？ | Have you considered any alternative solutions?

  - type: textarea
    id: additional
    attributes:
      label: 补充信息 | Additional Context
      description: 任何其他相关截图、参考链接或背景信息 | Any screenshots, links, or additional context.
