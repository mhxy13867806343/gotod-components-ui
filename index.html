<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-preset="naive">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gotod-components-ui | Godot 4.x Vue-Style Component Library</title>
  <!-- FontAwesome 6 Universal Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Local Offline Vector Icons -->
  <link rel="stylesheet" href="assets/icons/icons.css?v=20260831_80">
  <!-- Local Theme Tokens & Stylesheet -->
  <link rel="stylesheet" href="assets/css/theme.css?v=20260831_80">
  <link rel="stylesheet" href="assets/css/style.css?v=20260831_80">
  <!-- Overtrue Share.js Stylesheet (社交分享组件) -->
  <link rel="stylesheet" href="assets/css/share.min.css?v=20260831_80">
</head>
<body>
  <!-- Top Dual-Mode Progress Bar (顶部双模进度条: 路由加载 + 上下滚动阅读) -->
  <div id="topProgressBar" class="top-progress-bar"></div>

  <!-- Header -->
  <header>
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="#guide-install" class="brand" onclick="switchTopSection('guide', 'guide-install'); return false;">
        <i class="fa-solid fa-shapes" style="color: var(--primary);"></i>
        <span>gotod-components-ui</span>
        <span class="brand-badge">Godot 4.x + Vue UI</span>
      </a>

      <!-- Clean Top Section Dropdown (No Overflow, Full Width Clean Navigation) -->
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:12px; font-weight:600; color:var(--text-secondary); white-space:nowrap;">板块:</span>
        <div id="topNavSelectContainer" class="g-top-menu-host"></div>
      </div>
    </div>

    <div class="header-actions">
      <!-- Global Search Trigger Button using UI Component Style -->
      <button class="g-btn g-btn-default" style="height:32px; padding:0 12px; font-size:12px; gap:8px; border-radius:var(--radius); cursor:pointer;" onclick="openGlobalSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>搜索...</span>
        <kbd style="background:var(--bg-surface); border:1px solid var(--border-base); border-radius:3px; padding:1px 5px; font-size:10px; color:var(--text-secondary); font-family:var(--font-mono);">Ctrl K</kbd>
      </button>

      <!-- Repository Links Dropdown -->
      <select class="select-theme" style="font-weight:600; font-size:12px; height:32px; padding:0 10px; cursor:pointer;" onchange="if(this.value){window.open(this.value, '_blank'); this.selectedIndex=0;}">
        <option value="">📖 语言与开发日志 (Docs & Logs)</option>
        <option value="https://github.com/mhxy13867806343/gotod-components-ui/blob/main/README.md">🇨🇳 中文文档 (README.md)</option>
        <option value="https://github.com/mhxy13867806343/gotod-components-ui/blob/main/README.en.md">🇺🇸 English Docs (README.en.md)</option>
        <option value="https://github.com/mhxy13867806343/gotod-components-ui/blob/main/CHANGELOG.md">📋 开发日志与Bug全记录 (CHANGELOG.md)</option>
        <option value="https://github.com/mhxy13867806343/gotod-components-ui/blob/main/CHANGELOG.en.md">📋 DevLog & Bugfix History (CHANGELOG.en.md)</option>
        <option value="https://github.com/mhxy13867806343/gotod-components-ui/releases">📦 版本下载 (Releases)</option>
        <option value="https://github.com/mhxy13867806343/gotod-components-ui">⭐ GitHub 源码仓库</option>
        <option value="https://docs.godotengine.org/en/stable/">Godot 官方引擎文档</option>
      </select>

      <button class="g-btn g-btn-default" onclick="openShareModal()" title="一键分享当前页面至社交平台 (Overtrue Share.js)" style="height:32px; padding:0 10px; font-size:12px; gap:6px;">
        <i class="fa-solid fa-share-nodes" style="color:var(--primary);"></i>
        <span>分享</span>
      </button>

    </div>
  </header>

  <!-- Right Floating JD-Style Fixed Sidebar Navigation Dock (仿京东右侧固定浮动悬浮挂件栏) -->
  <div class="jd-sidebar-dock" id="jdSidebarDock">
    <!-- 1. 版本更新日志 (GSteps) -->
    <button class="jd-dock-item" onclick="switchTopSection('changelog')" title="查看基于 Steps 步骤条构建的版本更新日志">
      <span class="jd-dock-badge">v1.6</span>
      <i class="fa-solid fa-clock-rotate-left" style="color:#eab308;"></i>
      <span>日志</span>
    </button>

    <!-- 2. 版本与资料菜单 (GMenu) -->
    <div class="jd-dock-menu">
      <button class="jd-dock-item" type="button" onclick="if(window.toggleDockMenu){toggleDockMenu(event);}else{event.stopPropagation();this.parentElement.classList.toggle('is-open');}" title="打开版本与资料菜单" aria-haspopup="menu" aria-expanded="false">
        <i class="fa-solid fa-layer-group" style="color:#67e8f9;"></i>
        <span>版本</span>
      </button>
      <div class="g-menu jd-dock-submenu" role="menu" aria-label="版本与资料菜单">
        <a href="v2/v-vue/" class="g-menu-item" role="menuitem">
          <i class="fa-brands fa-vuejs" style="color:#42b883;"></i>
          <span>Vue 版</span>
        </a>
        <a href="v2/v-jquery/" class="g-menu-item" role="menuitem">
          <i class="fa-brands fa-js" style="color:#f7df1e;"></i>
          <span>JQ 版</span>
        </a>
        <a href="library/" class="g-menu-item" role="menuitem">
          <i class="fa-solid fa-book-open-reader" style="color:#67e8f9;"></i>
          <span>Library</span>
        </a>
      </div>
    </div>

    <!-- 3. 社交分享组件 (Overtrue Share.js) -->
    <button class="jd-dock-item" onclick="window.openShareModal()" title="一键分享当前页面至微信/QQ/微博/Twitter">
      <i class="fa-solid fa-share-nodes" style="color:#38bdf8;"></i>
      <span>分享</span>
    </button>

    <!-- 6. 版本更新检测 / 触发更新弹窗 -->
    <button class="jd-dock-item" onclick="if (typeof window.testVersionPollingUpdate === 'function') window.testVersionPollingUpdate(); else if (typeof window.showVersionUpdateModal === 'function') window.showVersionUpdateModal(window.forceHardReload); else window.forceHardReload();" title="检测并触发版本更新弹窗 (Version Polling)">
      <i class="fa-solid fa-rotate" style="color:var(--primary);"></i>
      <span>更新</span>
    </button>

    <!-- 7. 源码仓库 (GitHub) -->
    <a href="https://github.com/mhxy13867806343/gotod-components-ui" target="_blank" class="jd-dock-item" title="访问 GitHub 开源仓库">
      <i class="fa-brands fa-github"></i>
      <span>源码</span>
    </a>

    <!-- 8. 回到顶部 -->
    <button class="jd-dock-item" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); const el=document.getElementById('mainContent'); if(el) el.scrollTo({top: 0, behavior: 'smooth'});" title="回到顶部">
      <i class="fa-solid fa-arrow-up"></i>
      <span>顶部</span>
    </button>
  </div>

  <!-- App Layout -->
  <div class="app-container">
    <!-- Dynamic Sidebar -->
    <aside id="sidebarNav">
      <!-- Populated dynamically based on 1. Guide / 2. Components / 3. Game UI -->
    </aside>

    <!-- Main Content Area -->
    <main id="mainContent">
      <!-- Dynamic Content Rendered by JS -->
    </main>

    <!-- Naive UI / Element Plus Style Right-Side Anchor Outline (右侧大纲导航) -->
    <aside id="docAnchorNav" class="doc-anchor-nav">
      <div class="anchor-nav-inner" id="anchorNavInner">
        <!-- Populated dynamically based on current doc demos & API tables -->
      </div>
    </aside>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Dialog Modal Simulator -->
  <div class="g-modal-overlay" id="dialogModal" onclick="closeDialog(event)">
    <div class="g-modal-box" onclick="event.stopPropagation()">
      <div class="g-modal-header">
        <span id="dialogTitle">Dialog Modal Title</span>
        <button style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.2rem;" onclick="closeDialogDirect()">×</button>
      </div>
      <div class="g-modal-body" id="dialogBody" style="color: var(--text-regular);">
        This is a modal dialog popup built with GDialog in Godot 4.x.
      </div>
      <div class="g-modal-footer">
        <button class="g-btn g-btn-default" onclick="closeDialogDirect()">Cancel</button>
        <button class="g-btn g-btn-primary" onclick="confirmDialog()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Drawer Simulator -->
  <div class="g-drawer-overlay" id="drawerModal" onclick="closeDrawer(event)">
    <div class="g-drawer-box" onclick="event.stopPropagation()">
      <div class="g-modal-header">
        <span>Drawer 抽屉面板</span>
        <button style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.2rem;" onclick="closeDrawerDirect()">×</button>
      </div>
      <div style="flex:1; color: var(--text-regular); font-size: 0.9rem;">
        <p>这是从右侧滑出的抽屉面板，支持左右上下 4 个方向滑出。</p>
        <div style="margin-top: 16px;">
          <label style="display:block; margin-bottom: 6px; font-size: 0.85rem;">配置项：</label>
          <div class="g-input-wrapper" style="width: 100%;">
            <input class="g-input" type="text" value="Drawer Property Value">
          </div>
        </div>
      </div>
      <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
        <button class="g-btn g-btn-default" onclick="closeDrawerDirect()">关闭</button>
        <button class="g-btn g-btn-primary" onclick="closeDrawerDirect(); showToast('Drawer settings saved!', 'success');">保存</button>
      </div>
    </div>
  </div>

  <!-- Vant Style GPopup Simulator Overlay -->
  <div class="g-popup-mask" id="simPopupMask" onclick="if(event.target===this) closeSimPopup()">
    <div class="g-popup-panel g-popup-center" id="simPopupPanel" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-weight:600; font-size:16px;">
        <span id="simPopupTitle">GPopup 弹出层</span>
        <button id="simPopupClose" style="background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:18px;" onclick="closeSimPopup()">×</button>
      </div>
      <div id="simPopupBody" style="color:var(--text-regular); font-size:14px; line-height:1.6;">
        <!-- Dynamic Popup Body Content -->
      </div>
    </div>
  </div>

  <!-- Vant Style GOverlay Simulator -->
  <div class="g-overlay-mask" id="simOverlayMask" onclick="if(event.target===this) closeSimOverlay()">
    <div id="simOverlaySlot" onclick="event.stopPropagation()" style="display:none; padding:24px; background:var(--bg-surface); border:1px solid var(--border-base); border-radius:var(--radius-lg); box-shadow:var(--shadow); min-width:280px; max-width:90vw;">
      <!-- Embedded Content Slot -->
    </div>
  </div>

  <!-- Vant Style GActionSheet Simulator -->
  <div class="g-action-sheet-mask" id="simActionSheetMask" onclick="if(event.target===this) closeSimActionSheet()">
    <div class="g-action-sheet-panel" id="simActionSheetPanel">
      <div class="g-action-sheet-header" id="simActionSheetHeader" style="display:none;"></div>
      <div id="simActionSheetList"></div>
      <div class="g-action-sheet-cancel" id="simActionSheetCancel" onclick="closeSimActionSheet()">取消</div>
    </div>
  </div>

  <!-- Vant Style GPicker Wheel Simulator -->
  <div class="g-picker-mask" id="simPickerMask" onclick="if(event.target===this) closeSimPicker()">
    <div class="g-picker-panel" id="simPickerPanel">
      <div class="g-picker-toolbar">
        <button class="g-btn g-btn-text" style="color:var(--text-secondary);" onclick="closeSimPicker()">取消</button>
        <span style="font-weight:600; font-size:15px;" id="simPickerTitle">选择职业</span>
        <button class="g-btn g-btn-text" style="color:var(--primary); font-weight:700;" onclick="confirmSimPicker()">确定</button>
      </div>
      <div class="g-picker-list" id="simPickerList"></div>
    </div>
  </div>

  <!-- Element Plus Style GTour Simulator -->
  <div class="g-tour-mask" id="simTourMask">
    <div class="g-tour-popover" id="simTourPopover">
      <div style="font-weight:700; font-size:15px; margin-bottom:6px; color:var(--primary);" id="simTourTitle">步骤标题</div>
      <div style="font-size:13px; color:var(--text-regular); line-height:1.5; margin-bottom:14px;" id="simTourDesc">步骤描述内容</div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:var(--text-secondary);" id="simTourStepsIndicator">1/3</span>
        <div style="display:flex; gap:8px;">
          <button class="g-btn g-btn-default" style="height:28px; padding:0 8px; font-size:11px;" id="simTourPrevBtn" onclick="prevSimTourStep()">上一步</button>
          <button class="g-btn g-btn-primary" style="height:28px; padding:0 12px; font-size:11px;" id="simTourNextBtn" onclick="nextSimTourStep()">下一步</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Vant Style GToast Simulator -->
  <div class="g-toast-mask" id="simToastMask">
    <div class="g-toast-box" id="simToastBox"></div>
  </div>

  <!-- Golden Sun / JRPG GDialogue Simulator -->
  <div class="g-dialogue-mask" id="simDialogueMask" onclick="nextSimDialogue()">
    <div class="g-dialogue-box" id="simDialogueBox">
      <div class="g-dialogue-avatar" id="simDialogueAvatar">🧙‍♂️</div>
      <div class="g-dialogue-body">
        <div class="g-dialogue-speaker" id="simDialogueSpeaker">神秘长者</div>
        <div class="g-dialogue-content" id="simDialogueText"></div>
        <div class="g-dialogue-options" id="simDialogueOptions"></div>
      </div>
      <div class="g-dialogue-indicator" id="simDialogueIndicator">▼</div>
    </div>
  </div>

  <!-- Global Search Modal Dialog (Command Palette) -->
  <div id="globalSearchModal" class="global-search-backdrop" style="display:none;" onclick="if(event.target===this) closeGlobalSearch()">
    <div class="global-search-card">
      <div style="padding: 14px 16px; border-bottom: 1px solid var(--border-base); display: flex; align-items: center; gap: 10px; background: var(--bg-card);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary); flex-shrink:0;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="globalSearchInput" type="text" placeholder="搜索全部 28+ 组件、指南、游戏案例、Hooks、信号事件、装饰器..." style="flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: 14px; font-family: inherit;" oninput="handleGlobalSearchInput(this.value)">
        <kbd style="background: var(--bg-surface); border: 1px solid var(--border-base); border-radius: 3px; padding: 2px 6px; font-size: 10px; color: var(--text-secondary); font-family: var(--font-mono); cursor:pointer;" onclick="closeGlobalSearch()">ESC</kbd>
      </div>
      <div id="globalSearchResults" style="max-height: 380px; overflow-y: auto; padding: 8px; background: var(--bg-surface);">
        <!-- Dynamically rendered search results -->
      </div>
      <div style="padding: 8px 16px; background: var(--bg-card); border-top: 1px solid var(--border-base); display: flex; justify-content: space-between; font-size: 11px; color: var(--text-disabled);">
        <span>按 <kbd style="font-family:var(--font-mono); font-size:10px;">Ctrl K</kbd> 随时开启搜索</span>
        <span>已索引 9 大板块与全部 28+ 个 UI 控件</span>
      </div>
    </div>
  </div>

  <!-- Uni-UI Style Expandable FAB Floating Action Toolbar in Bottom-Right -->
  <div class="g-fab-wrapper" id="gFabWrapper">
    <!-- Expanded Menu Content -->
    <div class="g-fab-menu" id="gFabMenu">
      <div class="g-fab-item">
        <span class="g-fab-label"><i class="fa-solid fa-palette"></i> 风格:</span>
        <select id="presetSelect" class="select-theme" onchange="changePreset(this.value)" style="border-radius:16px; height:28px; font-size:11px; padding:0 8px; background:var(--bg-surface);">
          <option value="naive">Naive UI Style</option>
          <option value="element">Element Plus Style</option>
          <option value="ant">Ant Design Style</option>
          <option value="vant">Vant UI Style</option>
        </select>
      </div>

      <div class="g-fab-divider"></div>

      <button class="g-fab-btn" onclick="toggleTheme()" title="切换深浅主题">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
        <span id="themeText" style="font-size:11px; font-weight:600;">Dark</span>
      </button>

      <div class="g-fab-divider"></div>

      <button class="g-fab-btn" onclick="if (typeof window.testVersionPollingUpdate === 'function') window.testVersionPollingUpdate(); else window.forceHardReload();" title="检测并预览新版本更新弹窗 (Version Polling)">
        <i class="fa-solid fa-rotate" style="color:var(--primary);"></i>
        <span style="font-size:11px; font-weight:600; color:var(--primary);">更新</span>
      </button>

      <div class="g-fab-divider"></div>

      <button class="g-fab-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="返回顶部">
        <i class="fa-solid fa-arrow-up"></i>
        <span style="font-size:11px; font-weight:600;">顶部</span>
      </button>

      <div class="g-fab-divider"></div>

      <button class="g-fab-btn" onclick="window.open('http://mail.qq.com/cgi-bin/qm_share?t=qm_mailme&email=uYGPgI6IiYiOgPnIyJfa1tQ', '_blank')" title="给我写信">
        <i class="fa-regular fa-envelope"></i>
        <span style="font-size:11px; font-weight:600;">写信</span>
      </button>
    </div>

    <!-- Main FAB Trigger Circular Button (uni-ui style with close toggle) -->
    <button class="g-fab-trigger" id="gFabTrigger" onclick="toggleFabMenu()" title="快捷控制台 (FAB 悬浮按钮)">
      <i class="fa-solid fa-xmark" id="gFabIcon"></i>
    </button>
  </div>

  <!-- Local Standalone UI Helpers Modules (All modularized < 1000 lines) -->
  <script src="assets/js/ui_core.js?v=20260831_80"></script>
  <script src="assets/js/ui_simulators.js?v=20260831_80"></script>
  <script src="assets/js/ui_feedback_simulators.js?v=20260831_80"></script>
  <script src="assets/js/ui_dialogue_simulators.js?v=20260831_80"></script>
  <script src="assets/js/ui_select_engine.js?v=20260831_80"></script>
  <script src="assets/js/ui_icon_tools.js?v=20260831_80"></script>
  <script src="assets/js/ui_data_components.js?v=20260831_80"></script>
  <script src="assets/js/ui_game_engine_studios.js?v=20260831_80"></script>

  <script src="assets/js/sidebar_nav.js?v=20260831_80"></script>
  <script src="assets/js/icons_catalog.js?v=20260831_80"></script>
  <script src="assets/js/components_catalog.js?v=20260831_80"></script>
  <!-- Individual Component Catalogs (One component per file) -->
  <script src="assets/js/components_button.js?v=20260831_80"></script>
  <script src="assets/js/components_text.js?v=20260831_80"></script>
  <script src="assets/js/components_container.js?v=20260831_80"></script>
  <script src="assets/js/components_divider.js?v=20260831_80"></script>
  <script src="assets/js/components_icon.js?v=20260831_80"></script>
  <script src="assets/js/components_menu.js?v=20260831_80"></script>
  <script src="assets/js/components_fab.js?v=20260831_80"></script>
  <script src="assets/js/components_input.js?v=20260831_80"></script>
  <script src="assets/js/components_textarea.js?v=20260831_80"></script>
  <script src="assets/js/components_input_number.js?v=20260831_80"></script>
  <script src="assets/js/components_stepper.js?v=20260831_80"></script>
  <script src="assets/js/components_switch.js?v=20260831_80"></script>
  <script src="assets/js/components_checkbox.js?v=20260831_80"></script>
  <script src="assets/js/components_radio.js?v=20260831_80"></script>
  <script src="assets/js/components_select.js?v=20260831_80"></script>
  <script src="assets/js/components_picker.js?v=20260831_80"></script>
  <script src="assets/js/components_slider.js?v=20260831_80"></script>
  <script src="assets/js/components_form.js?v=20260831_80"></script>
  <script src="assets/js/components_dialog.js?v=20260831_80"></script>
  <script src="assets/js/components_dialogue.js?v=20260831_80"></script>
  <script src="assets/js/components_chat.js?v=20260831_80"></script>
  <script src="assets/js/components_popup.js?v=20260831_80"></script>
  <script src="assets/js/components_overlay.js?v=20260831_80"></script>
  <script src="assets/js/components_action_sheet.js?v=20260831_80"></script>
  <script src="assets/js/components_popover.js?v=20260831_80"></script>
  <script src="assets/js/components_notice_bar.js?v=20260831_80"></script>
  <script src="assets/js/components_message.js?v=20260831_80"></script>
  <script src="assets/js/components_toast.js?v=20260831_80"></script>
  <script src="assets/js/components_alert.js?v=20260831_80"></script>
  <script src="assets/js/components_drawer.js?v=20260831_80"></script>
  <script src="assets/js/components_tooltip.js?v=20260831_80"></script>
  <script src="assets/js/components_loading.js?v=20260831_80"></script>
  <script src="assets/js/components_skeleton.js?v=20260831_80"></script>
  <script src="assets/js/components_tour.js?v=20260831_80"></script>
  <script src="assets/js/components_haptic.js?v=20260831_80"></script>
  <script src="assets/js/components_ai_dialogue.js?v=20260831_80"></script>
  <script src="assets/js/components_card.js?v=20260831_80"></script>
  <script src="assets/js/components_tag.js?v=20260831_80"></script>
