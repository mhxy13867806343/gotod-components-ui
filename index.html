<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-preset="naive">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gotod-components-ui | Godot 4.x Vue-Style Component Library</title>
  <!-- Local Offline Vector Icons -->
  <link rel="stylesheet" href="assets/icons/icons.css">
  <!-- Local Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="#" class="brand" onclick="switchTopSection('components')">
        <i class="fa-solid fa-shapes" style="color: var(--primary);"></i>
        <span>gotod-components-ui</span>
        <span class="brand-badge">Godot 4.x + Vue UI</span>
      </a>

      <!-- Clean Top Section Dropdown (No Overflow, Full Width Clean Navigation) -->
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:12px; font-weight:600; color:var(--text-secondary); white-space:nowrap;">板块:</span>
        <select id="topSectionSelect" class="select-theme" onchange="switchTopSection(this.value)" style="font-weight:600; font-size:13px; height:32px; padding:0 12px; min-width:240px; border-color:var(--primary); cursor:pointer;">
          <option value="guide">1. 指南与快速上手 (Guide)</option>
          <option value="components" selected>2. 组件库全量文档 (Components)</option>
          <option value="game">3. 游戏实战案例 (Game UI)</option>
          <option value="playground">4. 属性与方法演练 (API Playground)</option>
          <option value="imperative">5. 编程式/命令式调用 (Imperative API)</option>
          <option value="hooks">6. Hooks 响应式钩子 (Vue Hooks)</option>
          <option value="studio">7. .tres 资源工坊与主题导出 (Resource Studio)</option>
        </select>
      </div>
    </div>

    <div class="header-actions">
      <!-- Global Search Trigger Button using UI Component Style -->
      <button class="g-btn g-btn-default" style="height:32px; padding:0 12px; font-size:12px; gap:8px; border-radius:var(--radius); cursor:pointer;" onclick="openGlobalSearch()">
        <i class="fa-solid fa-magnifying-glass" style="color:var(--primary);"></i>
        <span>搜索...</span>
        <kbd style="background:var(--bg-surface); border:1px solid var(--border-base); border-radius:3px; padding:1px 5px; font-size:10px; color:var(--text-secondary); font-family:var(--font-mono);">Ctrl K</kbd>
      </button>

      <!-- Preset Select -->
      <select id="presetSelect" class="select-theme" onchange="changePreset(this.value)">
        <option value="naive">Naive UI Style (Green)</option>
        <option value="element">Element Plus Style (Blue)</option>
        <option value="ant">Ant Design Style (Geek Blue)</option>
        <option value="vant">Vant UI Style (Mobile)</option>
      </select>
      <!-- Dark/Light Mode -->
      <button class="btn-icon" onclick="toggleTheme()">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
        <span id="themeText">Dark</span>
      </button>
      <a href="https://github.com/mhxy13867806343/gotod-components-ui" target="_blank" class="btn-icon">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>
      <a href="https://gitee.com/fangjiayu/gotod-components-ui" target="_blank" class="btn-icon">
        <i class="fa-solid fa-code-branch"></i>
        <span>Gitee</span>
      </a>
      <a href="https://gitcode.com/m200s/gotod-components-ui" target="_blank" class="btn-icon">
        <i class="fa-solid fa-cube"></i>
        <span>GitCode</span>
      </a>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-container">
    <!-- Dynamic Sidebar -->
    <aside id="sidebarNav">
      <!-- Populated dynamically based on 1. Guide / 2. Components / 3. Game UI -->
    </aside>

    <!-- Main Content Area -->
    <main id="mainContent">
      <!-- Dynamic Content Rendered by JS -->
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Dialog Modal Simulator -->
  <div class="g-modal-overlay" id="dialogModal" onclick="closeDialog(event)">
    <div class="g-modal-box" onclick="event.stopPropagation()">
      <div class="g-modal-header">
        <span id="dialogTitle">Dialog Modal Title</span>
        <button style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.2rem;" onclick="closeDialogDirect()">×</button>
      </div>
      <div class="g-modal-body" id="dialogBody" style="color: var(--text-regular);">
        This is a modal dialog popup built with GDialog in Godot 4.x.
      </div>
      <div class="g-modal-footer">
        <button class="g-btn g-btn-default" onclick="closeDialogDirect()">Cancel</button>
        <button class="g-btn g-btn-primary" onclick="confirmDialog()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Drawer Simulator -->
  <div class="g-drawer-overlay" id="drawerModal" onclick="closeDrawer(event)">
    <div class="g-drawer-box" onclick="event.stopPropagation()">
      <div class="g-modal-header">
        <span>Drawer 抽屉面板</span>
        <button style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.2rem;" onclick="closeDrawerDirect()">×</button>
      </div>
      <div style="flex:1; color: var(--text-regular); font-size: 0.9rem;">
        <p>这是从右侧滑出的抽屉面板，支持左右上下 4 个方向滑出。</p>
        <div style="margin-top: 16px;">
          <label style="display:block; margin-bottom: 6px; font-size: 0.85rem;">配置项：</label>
          <div class="g-input-wrapper" style="width: 100%;">
            <input class="g-input" type="text" value="Drawer Property Value">
          </div>
        </div>
      </div>
      <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
        <button class="g-btn g-btn-default" onclick="closeDrawerDirect()">关闭</button>
        <button class="g-btn g-btn-primary" onclick="closeDrawerDirect(); showToast('Drawer settings saved!', 'success');">保存</button>
      </div>
    </div>
  <!-- Global Search Modal Dialog (Command Palette) -->
  <div id="globalSearchModal" class="modal-backdrop" style="display:none;" onclick="if(event.target===this) closeGlobalSearch()">
    <div class="modal-card" style="max-width: 620px; padding: 0; overflow: hidden; border-radius: 12px; box-shadow: var(--shadow-lg);">
      <div style="padding: 14px 16px; border-bottom: 1px solid var(--border-base); display: flex; align-items: center; gap: 10px; background: var(--bg-card);">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--primary); font-size: 1.1rem;"></i>
        <input id="globalSearchInput" type="text" placeholder="搜索全部 28+ 组件、指南、游戏案例、Hooks、命令式API (支持中英文)..." style="flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: 14px; font-family: inherit;" oninput="handleGlobalSearchInput(this.value)">
        <kbd style="background: var(--bg-surface); border: 1px solid var(--border-base); border-radius: 3px; padding: 2px 6px; font-size: 10px; color: var(--text-secondary); font-family: var(--font-mono); cursor:pointer;" onclick="closeGlobalSearch()">ESC</kbd>
      </div>
      <div id="globalSearchResults" style="max-height: 380px; overflow-y: auto; padding: 8px; background: var(--bg-surface);">
        <!-- Dynamically rendered search results -->
      </div>
      <div style="padding: 8px 16px; background: var(--bg-card); border-top: 1px solid var(--border-base); display: flex; justify-content: space-between; font-size: 11px; color: var(--text-disabled);">
        <span>按 <kbd style="font-family:var(--font-mono); font-size:10px;">Ctrl K</kbd> 随时开启搜索</span>
        <span>已索引 7 大板块与全部 28+ 个 UI 控件</span>
      </div>
    </div>
  </div>

  <!-- Local Standalone Logic Modules -->
  <script src="assets/js/components_catalog.js"></script>
  <script src="assets/js/game_templates.js"></script>
  <script src="assets/js/api_playground.js"></script>
  <script src="assets/js/imperative_api.js"></script>
  <script src="assets/js/hooks_catalog.js"></script>
  <script src="assets/js/resource_studio.js"></script>
  <script src="assets/js/global_search.js"></script>
  <script src="assets/js/nav_dropdown.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
